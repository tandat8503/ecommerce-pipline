project:
  name: ecommerce_pipeline
  environment: local

data:
  raw_path: data/raw
  staging_path: data/staging/ecommerce
  warehouse_path: data/warehouse/ecommerce
  pipeline_date: auto

files:
  orders: orders/orders.csv
  order_items: order_items/order_items.csv
  customers: customers/customers.csv
  payments: payments/payments.csv
  products: products/products.csv

business:
  revenue_status: delivered
  valid_order_statuses:
    - delivered
    - shipped
    - canceled
    - processing
    - invoiced
    - unavailable
    - approved
    - created

load:
  target: local
  write_latest: true
  write_partitioned: true

bigquery:
  enabled: false
  project_id: ""
  dataset: ecommerce_dwh
  location: US

logging:
  level: INFO
  log_dir: logs
